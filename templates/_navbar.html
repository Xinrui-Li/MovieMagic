{# Shared navigation bar, included at the top of every page. #}
<header class="navbar">
    <a href="{{ url_for('home') }}" class="logo">MOVIE<span>MAGIC</span></a>

    <nav class="main-nav">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('home') }}#movies">Discover Movies</a>
        <a href="{{ url_for('home', media='tv') }}#movies">TV Shows</a>

        {% if session.get('user_id') %}
            <a href="{{ url_for('watchlist') }}">My Watchlist</a>
            <a href="{{ url_for('profile') }}">My Profile</a>
        {% endif %}

        <a href="{{ url_for('home') }}#about">About</a>

        {% if session.get('user_id') %}
            <span class="nav-username">
                Hi, {{ session.get('username') }}
            </span>

            <form method="POST"
                  action="{{ url_for('logout') }}"
                  class="nav-logout-form">
                <button type="submit" class="nav-auth-button">
                    Logout
                </button>
            </form>
        {% else %}
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('register') }}" class="nav-register">
                Register
            </a>
        {% endif %}
    </nav>

    <label class="theme-control">
        <span class="theme-label">Theme</span>
        <select class="theme-selector" aria-label="Choose color theme">
            <option value="purple">Midnight Purple</option>
            <option value="ocean">Ocean Blue</option>
            <option value="forest">Forest Green</option>
            <option value="rose">Rose Pink</option>
        </select>
    </label>
</header>
