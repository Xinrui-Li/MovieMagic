
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Movie Magic</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<label class="theme-control">
    <span class="theme-label">Theme</span>
    <select class="theme-selector" aria-label="Choose color theme">
        <option value="purple">Midnight Purple</option>
        <option value="ocean">Ocean Blue</option>
        <option value="forest">Forest Green</option>
        <option value="rose">Rose Pink</option>
    </select>
</label>

<header class="navbar">
    <a href="/" class="logo">MOVIE<span>MAGIC</span></a>
    <nav>
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('register') }}">Register</a>
    </nav>
</header>

<main class="auth-page">
    <h1>Welcome Back</h1>
    <p>Log in to access your personal watchlist.</p>

    {% for message in get_flashed_messages() %}
        <p class="auth-message">{{ message }}</p>
    {% endfor %}

    <form method="POST" class="auth-form">
        <label for="username">Username</label>
        <input id="username" name="username" required>

        <label for="password">Password</label>
        <input id="password" name="password"
               type="password" required>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account?
        <a href="{{ url_for('register') }}">Register</a>
    </p>
</main>

<script src="{{ url_for('static', filename='theme.js') }}"></script>

</body>
</html>
